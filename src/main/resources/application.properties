spring.application.name=veterinaria-san-marcos-backend
server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veterinaria_san_marcos?
useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=veterinaria-auth
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}