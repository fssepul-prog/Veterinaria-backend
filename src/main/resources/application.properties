spring.application.name=veterinaria-san-marcos-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veterinaria_san_marcos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
